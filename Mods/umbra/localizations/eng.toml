boss.name = "Umbra"
battle.title = "Umbra, the Last Eclipse"
battle.description = "A three-phase boss at the Gate of Shadows. Break his guard, survive the greatsword, then outrun the storm."
zones/eclipse = "The Last Eclipse"
speaker.sensei = "SENSEI"
speaker.umbra = "UMBRA"
speaker.shadow = "SHADOW"
button.next = "..."
button.fight = "FIGHT"
button.end = "THE END"
prologue.card = "CHAPTER ZERO: THE LAST ECLIPSE. For three days the sun has been dimming over the Gate of Shadows."
prologue.sensei_1 = "The sun is going out, Shadow. Something behind the Gate is drinking its light."
prologue.sensei_2 = "Whatever waits there has taken three shapes already. Do not trust the first one you see."
prologue.umbra_1 = "Another shadow comes to the Gate. How fitting. Soon there will be nothing else."
prologue.umbra_2 = "Break me once, and I will change. Break me twice, and the sky will fall on you."
prologue.shadow_1 = "Then I will break you three times."
prologue.umbra_again = "Back again, little shadow? The dark remembers you."
epilogue.card = "The Gate falls silent. For the first time in days, the sun rises."
epilogue.sensei_1 = "You did it. The light is coming back."
epilogue.sensei_2 = "But an eclipse never truly ends, Shadow. It only waits for the next one."
